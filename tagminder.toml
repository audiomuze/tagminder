# tagminder.toml
#
# Main Tagminder configuration.
#
# Read this file as the operational contract for the normal staging workflow.
# Most scripts use it for default paths, schema expectations, cleanup behavior,
# report output, and selected script-specific policy settings.
#
# IMPORTANT:
# - `scripts/ingest/tags2db.py` reads `[columns].schema_columns` from this file as the canonical staging schema order.
# - The staging DB and master-data DB are separate on purpose.
# - Defaults below are working defaults, not just placeholders.
# - If you are new to Tagminder, the most important sections are:
#   - `[db]`
#   - `[master_data]`
#   - `[export]`
#   - `[cleanup]`
#   - `[paths]`
#   - `[scripts."22-infer-works-in-library.py"]`

# QUICKSTART (minimum you likely need to edit)
# - [db].path
#   - Path to your staging SQLite database (`alib`, `changelog`, snapshots, reports).
#   - Most scripts also support overriding this per-run via `--db PATH`.
# - [master_data].path
#   - Path to harvested/reference SQLite database used by enrichment and mapping scripts.
#   - This is where MusicBrainz lookup and contributor reference tables live.
# - [cleanup].keep_columns
#   - Required by the final cleanup step (01-null-unauthorised-tags.py).
#   - Any non-system columns NOT listed here will be set to NULL.
# - [export].db_path and [export].table_name
#   - Used by the export DB builder (98-create-export-db.py).
#   - table_name is required when running without `--table`.
# - [paths].cache_dir
#   - HTML report/dashboard output directory.
# - [scripts."22-infer-works-in-library.py"]
#   - Controls how conservative automatic work inference should be.

# KEY CONCEPTS
# - [columns].schema_columns
#   - Defines the canonical schema/order for `alib` during/after ingestion.
#   - It is a superset/schema contract.
#   - Ingestion may temporarily introduce additional columns.
#   - It does NOT mean a column is retained forever.
# - [cleanup].keep_columns
#   - Defines the retention allowlist after the final cleanup step.
#   - This is what determines which non-system columns remain populated.
#   - keep_columns MAY include columns not present in schema_columns; the cleanup step will warn.
# - staging DB vs master-data DB
#   - staging DB = your working library state
#   - master-data DB = harvested/reference inputs used to enrich the staging DB

[db]
# Main staging SQLite database.
# This is the DB that holds `alib`, `changelog`, snapshot tables, inference tables,
# and report tables created during normal Tagminder runs.
# Most scripts support overriding this per run via `--db PATH`.
path = "/tmp/amg/tagminder-staging.db"

# Common target table containing audio library rows.
alib_table = "alib"

# Changelog table name used for auditing changes.
changelog_table = "changelog"

[master_data]
# SQLite database containing harvested/reference master-data tables.
# Examples:
# - contributors_unified_disambiguated
# - contributors_unified_namesakes
# - musicbrainz_artists
# - musicbrainz_work_lookup_flat
# This DB is not your staging library DB.
path = "/tmp/amg/master-data.db"

[export]
# Export database generated by scripts/export/98-create-export-db.py.
# If this is a filename (no path), it will be created alongside the staging DB.
# The export DB is a narrowed write-back surface, not the main working database.
db_path = "tagminder-export.db"

# Table name to copy into the export DB.
# Required by 98-create-export-db.py when running without `--table`.
table_name = "alib"

[columns]
# Canonical column order for the `alib` table (ordered).
# Used by ingestion tooling (e.g., tags2db.py) as a schema+ordering contract.
