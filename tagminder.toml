	"url_wikipedia_artist_site",
	"url_wikipedia_release_site",
	"itunesalbumid",
	"album_dr",
	"review",
	"upc",
]

# Report table written into the staging DB (dropped/recreated each run).
table = "_INF_multi_value_tags_by_album"

# Optional: enable/disable scripts in a future orchestrator/TUI.
# (Not enforced by anything yet.)
[scripts]
# "08-normalize-subtitles.py" = { enabled = true }
# "09-normalize-live-markers.py" = { enabled = true }

# Optional: script-specific overrides (draft schema)
#
# Example:
# [scripts."10-normalize-genres-and-styles.py"]
# enabled = true
# cache_dir = "/tmp/amg_cache"

# Work inference policy controls (scripts/pipeline/22-infer-works-in-library.py)
#
# This script now:
# - rebuilds work_inference_candidates
# - refreshes user_vetted_works
# - auto-applies only strict definitive matches
#
# Leave these enabled if you want conservative behavior.
# When true, tracks matched by title/alias-only signals are never auto-applied
# unless corroborated by contributor-name match or artist-id match.
# Set to false to restore score-only auto-apply behavior.
[scripts."22-infer-works-in-library.py"]
auto_apply_requires_corroboration_for_title_only = true
# When true, auto-apply is limited to exact workid matches or unique exact title_norm matches.
auto_apply_requires_exact_workid_or_unique_exact_title = true
