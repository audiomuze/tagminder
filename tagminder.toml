[strings]
# Multi-value delimiter used in text fields (a *double* backslash in data).
# In TOML, to represent two literal backslash characters, use "\\\\".
# This delimiter affects import/export splitting plus token-aware cleanup scripts.
multivalue_delimiter = "\\\\"

[logging]
# Many scripts currently use logging.basicConfig(level=INFO, ...)
# Keep as string so we can map to logging levels later.
level = "INFO"

[paths]
# Used by dashboards, reports, and selected scripts for caches/intermediate outputs.
cache_dir = "/tmp/amg_cache"

# Step 19 (album DR): pipe-delimited CSV where each line is:
#   <__dirpath>|DR<n>
# Optional (opt-in): enable step 19 by setting this path, e.g.
dr_scores = "/tmp/dr_scores.csv"

[reports.missing_critical_tags_by_album]
# Step 94: Album-level exception-only report.
# If any track within a __dirpath (album folder) is missing any of these fields
# (NULL or empty after trimming), the album will be flagged.
# NOTE: Set this list to match your schema; you can add more later.
critical_columns = [
	"track_uuid",
	"bliss_analysis",
	"track",
	"title",
	"composer",
	"artist",
	"album",
	"albumartist",
	"year",
	"date",
	"originalyear",
	"originalreleasedate",
	"genre",
	"label",
	"replaygain_album_gain",
	"replaygain_album_peak",
	"replaygain_track_gain",
	"replaygain_track_peak",
    "album_dr",
]

# Report table written into the staging DB (dropped/recreated each run).
table = "_INF_missing_critical_tags_by_album"

[reports.track_sequence_by_album]
# Step 93: Track-number sequence exceptions (per album folder + disc).
# Flags:
#   - missing track numbers
#   - invalid track numbers (non-numeric)
#   - duplicate track numbers
#   - gaps in the numeric sequence 1..max(track)
#
# Disc grouping:
# - disc_column is optional; if empty or missing, all tracks are treated as disc 1.
# - disc values are parsed from leading digits (e.g. "1/2" -> 1).
track_column = "track"
disc_column = "discnumber"

# Report table written into the staging DB (dropped/recreated each run).
table = "_INF_track_sequence_by_album"

[reports.multi_value_tags_by_album]
# Step 95: Album-level exception-only report.
# Flags albums (by album-root derived from __dirpath) where any of these tags
# has more than one distinct non-empty value across tracks in the album.
#
# Notes:
# - Do NOT include track-unique identifiers (e.g. ISRC) or this will always trigger.
# - Multi-value text tags (genre/style/mood/theme) are tokenized using the
#   configured [strings].multivalue_delimiter and normalized for stable comparison.
tags = [
	"style",
	"mood",
	"theme",
	"compilation",
	"bootleg",
	"album",
	"albumartist",
	"year",
	"date",
	"originalyear",
	"originalreleasedate",
	"genre",
	"label",
	"musicbrainz_albumartistid",
	"musicbrainz_albumid",
